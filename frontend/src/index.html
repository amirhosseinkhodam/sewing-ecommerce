<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      This is a pure SPA (no SSR): `SeoService` overwrites these tags per
      route once Angular bootstraps, but a crawler or link-unfurler that
      doesn't execute JS only ever sees this static fallback, so it stays a
      reasonable description of the shop rather than placeholder text.
    -->
    <title>Sewing Shop</title>
    <meta
      name="description"
      content="Custom-made clothing and tailoring, made to order."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sewing Shop" />
    <meta
      property="og:description"
      content="Custom-made clothing and tailoring, made to order."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-100 dark:bg-slate-900">
    <app-root></app-root>
  </body>
</html>
