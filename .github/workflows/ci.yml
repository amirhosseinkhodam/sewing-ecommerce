name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sewing_ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both point at the throwaway CI database; the test helpers only require
      # that the two differ, so DATABASE_URL gets a different database name.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sewing_ecommerce_dev
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/sewing_ecommerce_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: git diff --exit-code
        name: Lint left no fixes behind
      - run: npm run build
      - run: npm run test:backend:coverage
      - run: npm run test:frontend
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            coverage
            playwright-report
            test-results
          if-no-files-found: ignore
